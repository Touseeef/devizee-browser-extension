<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devizee - Privacy Focused</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121826;
      --card-hover: #172033;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: rgba(99, 102, 241, 0.15);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 330px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 26px;
      height: 26px;
      border-radius: 6px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .brand-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    /* Status Card */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .status-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.2s;
    }

    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    .status-name {
      font-weight: 600;
      color: var(--text);
    }

    .status-tag {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Active Tab Card */
    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 14px;
    }

    .media-title {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .media-url {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 10px;
    }

    .btn-download {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }

    .btn-download:hover {
      background: var(--accent-hover);
    }

    .btn-download:active {
      transform: scale(0.98);
    }

    .btn-download.success {
      background: var(--success);
    }

    /* Toggles */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .toggle-label {
      font-size: 12px;
      color: var(--text);
      font-weight: 500;
    }

    .toggle-desc {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Modern Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #334155;
      transition: 0.2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* Target Selector */
    .select-target {
      width: 100%;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 500;
      outline: none;
      margin-top: 6px;
      cursor: pointer;
    }

    /* Footer */
    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon32.png" alt="Devizee Logo">
      <span class="brand-title">Devizee</span>
    </div>
    <span class="brand-badge">Privacy Focused</span>
  </div>

  <div class="status-card">
    <div class="status-info">
      <div id="statusDot" class="status-dot"></div>
      <div>
        <div id="statusText" class="status-name">Scanning...</div>
        <div id="statusSub" class="status-tag">Port detection</div>
      </div>
    </div>
    <button id="refreshStatusBtn" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:14px;" title="Refresh Connection">🔄</button>
  </div>

  <div class="media-card">
    <div class="media-title">Active Tab</div>
    <div id="activeTabUrl" class="media-url">Checking active page...</div>
    <button id="downloadTabBtn" class="btn-download">
      <span>⚡</span>
      <span id="downloadBtnText">Download with Devizee</span>
    </button>
  </div>

  <div class="section-title">Preferences</div>

  <div class="toggle-row">
    <div>
      <div class="toggle-label">Floating Video Grabber</div>
      <div class="toggle-desc">Show quick download pill on video players</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleFloatingPill">
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <div>
      <div class="toggle-label">Catch Browser Downloads</div>
      <div class="toggle-desc">Relay large direct file downloads</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleIntercept">
      <span class="slider"></span>
    </label>
  </div>

  <div style="margin-top: 10px;">
    <div class="toggle-label">Target Desktop Edition</div>
    <select id="selectTargetMode" class="select-target">
      <option value="auto">Auto-Detect (Lite or Pro)</option>
      <option value="lite">Devizee Lite (Port 42421)</option>
      <option value="pro">Devizee Pro (Port 42422)</option>
    </select>
  </div>

  <div class="footer">
    <span>🔒 100% Local • Zero Telemetry</span>
    <a href="#" id="optionsLink">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
